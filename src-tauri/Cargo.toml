[package]
name = "plain-note"
version = "0.1.0"
description = "Lightweight, encrypted, cloud-synced notes"
authors = ["Plain Note"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "plain_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-android-fs = "=30.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
